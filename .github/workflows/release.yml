name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          test -z "$(git ls-files -- '*.go' | xargs gofmt -l)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Race test
        run: go test -race ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          BIN_NAME="gu"
          ARCHIVE_BASE="gu_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            BIN_NAME="gu.exe"
          fi

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X github.com/wkqco33/go-updater/cmd.buildVersion=${VERSION}" \
            -o "${BIN_NAME}" .
          test -s "${BIN_NAME}"

          # Keep the archive layout stable (binary at the root) so existing
          # installers such as ppm continue to work.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -q "${ARCHIVE_BASE}.zip" "${BIN_NAME}"
          else
            tar -czf "${ARCHIVE_BASE}.tar.gz" "${BIN_NAME}"
          fi
          rm -f "${BIN_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gu_${{ matrix.goos }}_${{ matrix.goarch }}
          path: gu_${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify archives and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          compgen -G 'gu_*.tar.gz' > /dev/null || true
          compgen -G 'gu_*.zip' > /dev/null || true
          shopt -s nullglob
          archives=(gu_*.tar.gz gu_*.zip)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do
            case "$archive" in
              *.tar.gz) tar -tzf "$archive" >/dev/null ;;
              *.zip) unzip -t "$archive" >/dev/null ;;
            esac
            sha256sum "$archive" > "${archive}.sha256"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.0.0
        with:
          subject-path: |
            artifacts/gu_*.tar.gz
            artifacts/gu_*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            artifacts/gu_*.tar.gz \
            artifacts/gu_*.tar.gz.sha256 \
            artifacts/gu_*.zip \
            artifacts/gu_*.zip.sha256 \
            --generate-notes
