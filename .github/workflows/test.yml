name: Test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          test -z "$(git ls-files -- '*.go' | xargs gofmt -l)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -shuffle=on

      - name: Race test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Fuzz smoke (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test ./internal/versions -run=^$ -fuzz=FuzzVersionHelpersNeverPanic -fuzztime=15s
          go test ./internal/privatecache -run=^$ -fuzz=FuzzParseModuleSpecNeverPanics -fuzztime=15s

      - name: Vulnerabilities (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out
          ./scripts/check-coverage.sh coverage.out 60

      - name: Upload coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
