name: Test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        shell: bash
        run: |
          test -z "$(git ls-files -- '*.go' | xargs gofmt -l)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -shuffle=on

      - name: Race test (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out
          ./scripts/check-coverage.sh coverage.out 50

      - name: Upload coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
